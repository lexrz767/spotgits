<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Podstream Global Voting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Spotify Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* 🌌 STARS BACKGROUND */
    .stars, .stars2, .stars3 {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-repeat: repeat;
      z-index: -1;
      animation: moveStars 120s linear infinite;
    }

    .stars {
      background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                        radial-gradient(1px 1px at 40px 70px, #fff, transparent),
                        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                        radial-gradient(1px 1px at 90px 120px, #fff, transparent);
      background-size: 200px 200px;
    }

    .stars2 {
      background-image: radial-gradient(1px 1px at 50px 50px, #bbb, transparent),
                        radial-gradient(1px 1px at 100px 150px, #bbb, transparent);
      background-size: 300px 300px;
      animation-duration: 180s;
    }

    .stars3 {
      background-image: radial-gradient(2px 2px at 150px 150px, #999, transparent);
      background-size: 400px 400px;
      animation-duration: 240s;
    }

    @keyframes moveStars {
      from { transform: translateY(0); }
      to { transform: translateY(-1000px); }
    }

    /* CONTENT */
    .container {
      max-width: 420px;
      width: 100%;
      padding: 20px;
      z-index: 1;
    }

    .top-text {
      font-size: 14px;
      letter-spacing: 4px;
      opacity: 0.85;
      margin-bottom: 25px;
    }

    .welcome {
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .platform {
      font-size: 15px;
      letter-spacing: 4px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .spotify {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 35px;
      color: #1DB954;
      font-size: 18px;
    }

    .spotify i {
      font-size: 26px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 18px;
      border-radius: 40px;
      background: #ff4f7b;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255,79,123,0.35);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <!-- 🌠 Star layers -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="container">
    <div class="top-text">PODSTREAM GLOBAL<br>VOTING PLATFORM</div>

    <div class="welcome">WELCOME TO</div>
    <h1>PODSTREAM<br>GLOBAL</h1>

    <div class="platform">GOOGLE / SPOTIFY<br>VOTING PLATFORM</div>

    <div class="spotify">
      <i class="fa-brands fa-spotify"></i>
      Spotify
    </div>

    <a href="pg.html" class="btn">Vote with Instagram</a>
    <a href="fg.html" class="btn">Vote with Email</a>
    <a href="pt.html" class="btn">Vote with X (Twitter)</a>
  </div>

</body>
</html>
